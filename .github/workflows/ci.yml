name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
          - name: Ubuntu Clang
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cc }} ${{ matrix.cxx == 'clang++-18' && 'clang-18' || 'g++-13' }} libc6-dev

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DENABLE_DOCUMENTATION=OFF
          -DOnyxXML_USE_ICONV=ON

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config Debug --parallel

      - name: Run tests
        working-directory: ${{ github.workspace }}/build
        run: ctest --output-on-failure --build-config Debug

  sanitizers:
    name: Address Sanitizer and Undefined Behavior Sanitizer 
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libc6-dev

      - name: Configure CMake with sanitizers
        env:
          CC: clang-18
          CXX: clang++-18
        run: >
          cmake -B ${{ github.workspace }}/build-sanitize
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DENABLE_DOCUMENTATION=OFF
          -DOnyxXML_USE_ICONV=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build ${{ github.workspace }}/build-sanitize --config Debug --parallel

      - name: Run tests with sanitizers
        working-directory: ${{ github.workspace }}/build-sanitize
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --output-on-failure --build-config Debug
  
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 libc6-dev gcovr
 
      - name: Configure CMake with coverage
        env:
          CC: gcc-13
          CXX: g++-13
        run: >
          cmake -B ${{ github.workspace }}/build-coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DENABLE_DOCUMENTATION=OFF
          -DOnyxXML_USE_ICONV=ON
          -DOnyxXML_COVERAGE=ON
 
      - name: Build
        run: cmake --build ${{ github.workspace }}/build-coverage --config Debug --parallel
 
      - name: Run tests
        working-directory: ${{ github.workspace }}/build-coverage
        run: ctest --output-on-failure --build-config Debug
 
      - name: Generate coverage report
        id: coverage
        working-directory: ${{ github.workspace }}
        run: |
          gcovr --root . \
          --object-directory build-coverage \
          --filter 'include/onyxxml/.*' \
          --filter 'src/.*' \
          --exclude '.*_deps.*' \
          --exclude '.*/test/.*' \
          --print-summary \
          --html-details coverage.html \
          --xml coverage.xml
        
          python3 - << 'EOF'
          import xml.etree.ElementTree as ET
          import os

          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          
          line_rate = float(root.attrib.get('line-rate', 0.0))
          coverage_percentage = round(line_rate * 100, 1)

          if coverage_percentage >= 80.0:
              color = "brightgreen"
          elif coverage_percentage >= 60.0:
              color = "yellow"
          else:
              color = "red"

          print(f"Extracted coverage: {coverage_percentage}%")
          print(f"Assigned color: {color}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"coverage={coverage_percentage}\n")
              f.write(f"color={color}\n")
          EOF

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.html
            coverage.xml
          retention-days: 30

      - name: Publish coverage badge data
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          COVERAGE: ${{ steps.coverage.outputs.coverage }}
          COLOR: ${{ steps.coverage.outputs.color }}
        run: |
          mkdir -p /tmp/badge-publish
          cat > /tmp/badge-publish/coverage-badge.json <<EOF
          {
            "schemaVersion": 1,
            "label": "coverage",
            "message": "${COVERAGE}%",
            "color": "${COLOR}"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/badges-worktree
          if git fetch origin badges:refs/remotes/origin/badges 2>/dev/null; then
            git worktree add /tmp/badges-worktree origin/badges
            cd /tmp/badges-worktree
            git checkout -B badges
          else
            git worktree add --orphan -b badges /tmp/badges-worktree
            cd /tmp/badges-worktree
          fi

          cp /tmp/badge-publish/coverage-badge.json .
          git add coverage-badge.json
          git commit -m "Update coverage badge data" || echo "No changes to commit"
          git push origin badges --force

  install-test:
    name: Install and consume via find_package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 libc6-dev doxygen graphviz
 
      - name: Configure CMake
        env:
          CC: gcc-13
          CXX: g++-13
        run: >
          cmake -B ${{ github.workspace }}/build-install
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install-prefix
 
      - name: Build
        run: cmake --build ${{ github.workspace }}/build-install --config Release --parallel
 
      - name: Install
        run: cmake --install ${{ github.workspace }}/build-install --config Release
 
      - name: Scaffold a minimal external consumer
        run: |
          mkdir -p ${{ github.workspace }}/consumer
          cat > ${{ github.workspace }}/consumer/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.24)
          project(OnyxXMLConsumer CXX)
          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          find_package(OnyxXML REQUIRED)
          add_executable(Consumer main.cpp)
          target_link_libraries(Consumer PRIVATE OnyxXML::OnyxXML)
          EOF
          cat > ${{ github.workspace }}/consumer/main.cpp << 'EOF'
          #include "onyxxml/onyx.h"
          #include <cassert>
          int main() {
              using namespace onyx::tags;
              GenericNode root("root", NonVoid, Text("Hello World!"));
              assert(root.serialize() == "<root>Hello World!</root>");
              return 0;
          }
          EOF
 
      - name: Configure consumer against the installed package
        run: >
          cmake -B ${{ github.workspace }}/consumer/build
          -S ${{ github.workspace }}/consumer
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install-prefix
 
      - name: Build consumer
        run: cmake --build ${{ github.workspace }}/consumer/build --parallel
 
      - name: Run consumer
        run: ${{ github.workspace }}/consumer/build/Consumer
